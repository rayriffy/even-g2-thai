name: Build and archive Thai firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      G2FLASH_COMMIT: 877c8d9490db0d3717ca012dd0f54556af3701bd

    steps:
      - name: Check out g2-thai
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Check out reviewed g2flash helper
        working-directory: ..
        run: |
          git clone https://github.com/jimrandomh/g2flash.git g2flash
          git -C g2flash checkout --detach "$G2FLASH_COMMIT"
          test "$(git -C g2flash rev-parse HEAD)" = "$G2FLASH_COMMIT"
          test -z "$(git -C g2flash status --porcelain --untracked-files=all)"

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build and verify
        run: make check

      - name: Prepare verified archive inputs
        id: artifact
        run: python tools/prepare_ci_artifact.py

      - name: Record artifact hashes
        run: |
          sha256sum "${{ steps.artifact.outputs.firmware }}" patches/thai_patches.json > build/SHA256SUMS
          cat build/SHA256SUMS

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: g2-thai-${{ steps.artifact.outputs.version }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ steps.artifact.outputs.firmware }}
            build/SHA256SUMS
            build/thai-preview.png
            patches/thai_patches.json
            ${{ steps.artifact.outputs.rebase_json }}
            ${{ steps.artifact.outputs.rebase_doc }}
            fonts/maitree/OFL.txt
